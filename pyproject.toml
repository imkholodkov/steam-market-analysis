[project]
name = "steam-market-analysis"
version = "0.1.0"
description = "Анализ рынка игр в Steam"
readme = "README.md"
authors = [
    { name = "ivan.kholodkov", email = "ivan.kholodkov@onetwotrip.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
sma = "steam_market_analysis.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
docs = [
    "matplotlib>=3.11.2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "pandas>=3.0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "hooks"]

[[tool.mypy.overrides]]
# у pandas нет встроенных типов, pandas-stubs ради одного скрипта не ставим
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=steam_market_analysis --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/steam_market_analysis"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
