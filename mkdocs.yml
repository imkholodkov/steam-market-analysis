site_name: Разработка на Python и инженерия данных
site_description: Результаты исследований и лабораторных работ по анализу рынка игр в Steam
site_url: !ENV [SITE_URL, 'https://imkholodkov.github.io/steam-market-analysis/']
repo_url: https://github.com/imkholodkov/steam-market-analysis
docs_dir: docs
use_directory_urls: true
# results.md вставляется в p3/index.md через snippets, отдельной страницей не публикуется
exclude_docs: |
  lab2/p3/generated/*.md

theme:
  name: material
  language: ru

hooks:
  - hooks/build_info.py

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  # SVG-вывод: формулы рисуются без веб-шрифтов, которые privacy не скачивает заранее
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js

plugins:
  # скачивает внешние шрифты и скрипты (Google Fonts, MathJax) при сборке и отдаёт их с сайта
  - privacy
  - search:
      lang: ru

nav:
  - Лабораторная №1: lab1_report.md
  - Лабораторная №2:
      - Отчёт: lab2/index.md
      - T2. Теоретическое задание: lab2/t2.md
      - P3. Практическое задание: lab2/p3/index.md
